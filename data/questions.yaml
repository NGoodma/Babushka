# Второе предложение сообщения: вопрос бабушке.
# Каждому пользователю вопросы приходят в своём случайном порядке,
# без повторов, пока не пройдут все. Потом круг начинается заново.
# В настройках бота пользователь может выключить любые вопросы.
#
# id нужен, чтобы настройки пользователя не сломались, если поменять
# текст или порядок. Не меняй id у существующих вопросов. Для нового
# вопроса придумай новый id (латиница, до 20 символов).

questions:
  - {id: dela,      text: "Как у тебя дела?"}
  - {id: feel,      text: "Как ты себя чувствуешь?"}
  - {id: plans,     text: "Что сегодня планируешь делать?"}
  - {id: sleep,     text: "Как твой сон?"}
  - {id: weather,   text: "Какая у вас сегодня погода?"}
  - {id: week,      text: "Что интересного было на этой неделе?"}
  - {id: reading,   text: "Что сейчас читаешь или смотришь?"}
  - {id: neighbors, text: "Как там соседи поживают?"}
  - {id: walk,      text: "Выходила вчера погулять?"}
  - {id: young,     text: "Как жизнь молодая?"}
  - {id: dream,     text: "Что тебе сегодня снилось?"}
  - {id: howthere,  text: "Как ты там?"}
  - {id: city,      text: "Что нового в городе?"}
  - {id: howru,     text: "Как ты?"}
