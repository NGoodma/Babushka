# Праздники для бота Babushka.
#
# Фраза: «Бабуль, привет! {greeting}! {вопрос из data/questions.yaml}»
# Поле end меняет знак после greeting (по умолчанию «!»), например «.» для Великой пятницы.
#
# Источник: церковный календарь azbyka.ru (скачан 2026-11-05, годы 2027 и 2028).
#
# Как выбрать поздравление на дату (по убыванию приоритета):
#   1. movable с major: true (Пасха, Вербное, Вознесение, Троица, Великая пятница)
#   2. great: двунадесятые и великие неподвижные праздники
#   3. остальные movable (недели поста, Светлая седмица, родительские субботы)
#   4. fixed: память святого или праздник иконы на этот день
#
# Ключи great и fixed заданы датой ПО СТАРОМУ СТИЛЮ (юлианский календарь),
# потому что в невисокосные годы праздники с 1 по 13 марта по н. ст.
# сдвигаются относительно гражданской даты. Код переводит дату сам.
# Комментарий после каждой записи показывает дату по новому стилю для 1900–2099.
# 02-29 по ст. ст. бывает только в юлианский високосный год (раз в 4 года).

